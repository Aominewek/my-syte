<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ЦТБ — Контроль транспорта</title>
    <meta name="description" content="Система контроля транспорта ЦТБ: регистрация ТС, статусы, погрузка под кранами, учёт простоев, аналитика и отчёты.">
    <meta name="theme-color" content="#002d5a">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ЦТБ">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ===== ЭКРАН АВТОРИЗАЦИИ ===== -->
    <div id="auth-screen">
        <div class="auth-card">
            <div class="auth-brand">
                <img src="assets/logo.svg" alt="ЦТБ">
                <h1>ЦТБ</h1>
            </div>
            <div class="form-group">
                <label id="auth-login-label" for="login">ФИО сотрудника</label>
                <input type="text" id="login" placeholder="Фамилия Имя Отчество" autocomplete="username" oninput="ui.authMode()">
            </div>
            <div class="form-group">
                <label id="auth-pass-label" for="pass">Табельный номер</label>
                <input type="password" id="pass" placeholder="Табельный номер" autocomplete="current-password">
            </div>
            <div id="auth-error" class="auth-error"></div>
            <button class="btn btn-primary btn-block" onclick="app.login()">ВОЙТИ</button>
        </div>
    </div>

    <!-- ===== ОСНОВНОЕ ПРИЛОЖЕНИЕ ===== -->
    <div id="main-app" style="display: none;">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="assets/logo.svg" alt="ЦТБ">
                <b>ЦТБ</b>
            </div>
            <nav id="menu-container"></nav>
            <div class="sidebar-footer">
                <div id="user-info"></div>
                <button class="btn btn-danger btn-block btn-sm" onclick="app.logout()">ВЫХОД</button>
            </div>
        </aside>
        <main class="content-area">
            <header class="page-header">
                <h2 id="page-title">Раздел</h2>
                <div class="ph-actions">
                    <div class="top-tools" id="top-tools" style="display:none;">
                        <div class="tool-wrap">
                            <button class="icon-btn" id="bell-btn" onclick="ui.togglePanel('bell')" title="Уведомления">
                                <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
                                <span class="bell-count" id="bell-count" style="display:none;">0</span>
                            </button>
                            <div class="popover" id="bell-pop"></div>
                        </div>
                        <div class="tool-wrap">
                            <button class="icon-btn" id="profile-btn" onclick="ui.togglePanel('profile')" title="Профиль">
                                <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
                            </button>
                            <div class="popover" id="profile-pop"></div>
                        </div>
                    </div>
                    <div id="page-actions"></div>
                </div>
            </header>
            <div id="search-wrapper"><input type="text" id="global-search" class="search-input" placeholder="Поиск: номер, водитель, талон..." oninput="app.handleSearch(this.value)"></div>
            <div id="data-container"></div>
            <footer class="app-footer">© 2026 ЦТБ «Сургутнефтегаз» · Система контроля транспорта</footer>
        </main>
    </div>

    <!-- ===== МОДАЛКА ТАЛОНА-РАЗРЕШЕНИЯ ===== -->
    <div id="modal-permit" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <span>Талон-разрешение</span>
                <button class="close-btn" onclick="ui.closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="grid2">
                    <div class="form-group"><label>Заказчик</label><input type="text" id="p-customer"></div>
                    <div class="form-group"><label>Инженер ООГ</label><input type="text" id="p-eng-name"></div>
                    <div class="form-group"><label>№ крана</label><input type="text" id="p-crane"></div>
                    <div class="form-group"><label>№ стеллажа</label><input type="text" id="p-shelf"></div>
                    <div class="form-group"><label>Типоразмер труб</label><input type="text" id="p-pipe"></div>
                    <div class="form-group"><label>Количество</label><input type="text" id="p-qty"></div>
                </div>
                <div class="form-group">
                    <label>Вид погрузки</label>
                    <label class="inline-check"><input type="checkbox" id="p-type-1"> Труба</label>
                    <label class="inline-check"><input type="checkbox" id="p-type-2"> Патрубки</label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-success" onclick="app.savePermit()">ПЕЧАТЬ ТАЛОНА</button>
                <button class="btn btn-secondary" onclick="ui.closeModal()">ОТМЕНА</button>
            </div>
        </div>
    </div>

    <!-- ===== МОДАЛКА ПОГРУЗКИ ПОД КРАНОМ ===== -->
    <div id="modal-crane" class="modal-overlay">
        <div class="modal-content modal-sm">
            <div class="modal-header">
                <span>Погрузка под краном</span>
                <button class="close-btn" onclick="ui.closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p id="crane-info" class="crane-info"></p>
                <div class="form-group">
                    <label>Кран</label>
                    <select id="crane-select"></select>
                </div>
                <p id="crane-limit-hint" class="crane-hint"></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-success" id="crane-start-btn" onclick="app.startCrane(app.editingId)">НАЧАТЬ ПОГРУЗКУ</button>
                <button class="btn btn-accent" id="crane-finish-btn" style="display:none;" onclick="app.finishCrane(app.editingId)">ЗАВЕРШИТЬ ПОГРУЗКУ</button>
                <button class="btn btn-secondary" onclick="ui.closeModal()">ОТМЕНА</button>
            </div>
        </div>
    </div>

    <!-- ===== МОДАЛКА ПОДДЕРЖКИ / ОБРАЩЕНИЙ ===== -->
    <div id="modal-support" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <span>Поддержка и обращения</span>
                <button class="close-btn" onclick="ui.closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="support-body"></div>
        </div>
    </div>

    <!-- ===== КОНТЕЙНЕР УВЕДОМЛЕНИЙ ===== -->
    <div id="toast-container"></div>

    <script src="js/data.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/ui.js"></script>
    <script>
        if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').catch(function () {});
            });
        }
    </script>
</body>
</html>
